services:
  - type: web
    name: eduvaani-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
